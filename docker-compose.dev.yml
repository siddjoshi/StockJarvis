version: '3.8'

services:
  mysql:
    image: mariadb:10.11
    container_name: stockjarvis_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_password
      MYSQL_DATABASE: stockjarvis
      MYSQL_USER: jarvis
      MYSQL_PASSWORD: dev_password
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - dev_network

  redis:
    image: redis:7-alpine
    container_name: stockjarvis_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - dev_network

volumes:
  mysql_dev_data:
  redis_dev_data:

networks:
  dev_network:
    driver: bridge
