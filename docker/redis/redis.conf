# docker/redis/redis.conf - Redis configuration for StockJarvis

# Network Configuration
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Snapshotting (RDB Persistence)
# Save the DB on disk:
#   save <seconds> <changes>
#   Will save after the given seconds if at least the given number of write operations
save 900 1      # After 900 sec (15 min) if at least 1 key changed
save 300 10     # After 300 sec (5 min) if at least 10 keys changed
save 60 10000   # After 60 sec if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) Persistence - More durable than RDB
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # Options: always, everysec, no
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru  # Evict keys using LRU when memory limit is reached
maxmemory-samples 5

# Lazy Freeing (non-blocking deletes)
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Threaded I/O (Redis 6.0+)
io-threads 4
io-threads-do-reads yes

# Slow Log Configuration
slowlog-log-slower-than 10000  # Log queries slower than 10ms
slowlog-max-len 128

# Latency Monitor
latency-monitor-threshold 100  # Log events taking more than 100ms

# Event Notification (for keyspace events)
notify-keyspace-events "Ex"  # Enable expiration events

# Client Output Buffer Limits
# client-output-buffer-limit <class> <hard limit> <soft limit> <soft seconds>
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Advanced Configuration
hz 10  # Redis internal background tasks frequency
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Security - Password protection (uncomment and set if needed)
# requirepass your_redis_password_here

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# Active Defragmentation (Redis 4.0+)
# activedefrag yes
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100
# active-defrag-cycle-min 1
# active-defrag-cycle-max 25
