# pytest.ini - Pytest configuration for StockJarvis
# ================================================

[pytest]
# Test discovery paths
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version required
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers - fail on unknown markers
    --strict-markers
    # Coverage options
    --cov=core
    --cov=data
    --cov=config
    --cov=indicators
    --cov=strategies
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    # Asyncio mode
    --asyncio-mode=auto
    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    # Capture output
    --capture=no
    # Show durations
    --durations=10

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    slow: Slow running tests
    asyncio: Async tests
    requires_db: Tests that require database connection
    requires_broker: Tests that require broker API
    requires_market_data: Tests that require market data

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = 
    core
    data
    config
    indicators
    strategies
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
